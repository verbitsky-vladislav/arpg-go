# Сборка под раздачу: каждый пуш в main превращается в релиз со сборками под
# Windows, macOS (универсальная — Apple Silicon и Intel) и Linux.
#
# Ресурсы собираются один раз и общие на все платформы (tools/pack: в раздачу
# едет только то, что в игре может появиться), бинарник — на своём раннере:
# Ebitengine на macOS и Linux собирается через cgo, и кросс-компиляция обошлась
# бы дороже, чем три честных сборки.
name: Release

#
# Тегов у релизов два вида, и это разные вещи:
#
#	nightly — свежая сборка main. Тег один на все времена и переезжает с
#	          каждым пушем: иначе за месяц работы их накопились бы сотни, и
#	          в списке релизов нельзя было бы найти ничего.
#	vX.Y.Z  — веха. Ставится руками (git tag v0.1.0 && git push --tags), живёт
#	          вечно, и к ней подшивается список изменений с прошлой вехи.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Два релиза одновременно не собираются: они дерутся за теги.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assets:
    name: ресурсы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # pack проверяет собранное загрузчиками игры, а они тянут за собой
      # Ebitengine — отсюда системные библиотеки и виртуальный экран. ffmpeg —
      # чтобы сжать музыку: кодировщика Vorbis на Go нет.
      - name: системные библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libasound2-dev libxxf86vm-dev xvfb ffmpeg

      # -music ogg, а не auto: без ffmpeg сборка должна падать, а не тихо
      # потяжелеть на пять мегабайт.
      - name: собрать ресурсы раздачи
        run: xvfb-run -a go run ./tools/pack -out dist/assets -music ogg

      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: dist/assets
          retention-days: 3

  build:
    name: ${{ matrix.target }}
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-amd64, cgo: 1, bin: pixel-arpg }
          - { os: macos-latest, target: macos, cgo: 1, bin: pixel-arpg }
          - { os: windows-latest, target: windows-amd64, cgo: 0, bin: pixel-arpg.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: системные библиотеки
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libasound2-dev libxxf86vm-dev

      # -s -w выкидывают таблицу символов и отладку: игроку они не нужны, а
      # бинарник худеет на четверть. -H=windowsgui убирает чёрное окно консоли,
      # которое иначе висит за игрой всю сессию.
      #
      # macOS собирается универсальной: обе архитектуры на одном раннере и lipo
      # поверх. Отдельный раннер под Intel был бы честнее, но их выдают по
      # получасу — а игрок не должен выбирать между «M1» и «Intel», чтобы
      # запустить игру.
      - name: собрать игру
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          flags="-s -w"
          case "${{ matrix.target }}" in
            macos)
              GOARCH=arm64 go build -trimpath -ldflags "$flags" -o pixel-arpg.arm64 ./cmd/game
              GOARCH=amd64 go build -trimpath -ldflags "$flags" -o pixel-arpg.amd64 ./cmd/game
              lipo -create -output pixel-arpg pixel-arpg.arm64 pixel-arpg.amd64
              rm pixel-arpg.arm64 pixel-arpg.amd64
              lipo -archs pixel-arpg
              ;;
            windows-amd64)
              GOARCH=amd64 go build -trimpath -ldflags "-H=windowsgui $flags" -o pixel-arpg.exe ./cmd/game
              ;;
            *)
              GOARCH=amd64 go build -trimpath -ldflags "$flags" -o pixel-arpg ./cmd/game
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: ${{ matrix.bin }}
          retention-days: 3

  release:
    name: релиз
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Вся история и теги: список изменений к вехе снимается с них.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: art

      # Раздача — папка «игра + её ресурсы»: игра ищет assets рядом с собой,
      # поэтому распаковать и запустить достаточно.
      - name: собрать архивы
        run: |
          mkdir -p dist
          for t in linux-amd64 macos windows-amd64; do
            dir="pixel-arpg-$t"
            mkdir -p "$dir"
            cp -r art/assets "$dir/assets"
            cp art/bin-$t/* "$dir/"
            # Права на выполнение теряются при выгрузке артефакта — возвращаем.
            chmod +x "$dir"/pixel-arpg* || true
            cp .github/dist-README.txt "$dir/README.txt"
            zip -qr "dist/$dir.zip" "$dir"
          done
          ls -lh dist

      - name: выложить релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Собрано из коммита ${{ github.sha }}.

          Распакуйте архив целиком и запустите игру — ресурсы она ищет рядом с собой,
          поэтому один файл без папки `assets` работать не будет.

          | | |
          |---|---|
          | Windows | `pixel-arpg-windows-amd64.zip` |
          | macOS (Apple Silicon и Intel) | `pixel-arpg-macos.zip` |
          | Linux | `pixel-arpg-linux-amd64.zip` |

          Сборка не подписана: на macOS первый запуск — правым кликом и «Открыть».

          В раздачу едут только те ресурсы, которые в игре могут появиться, — лес и
          его обитатели, а не все восемнадцать биомов и шестьдесят тварей сразу.
          EOF

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Веха: список изменений с прошлой вехи — из самих коммитов, а не из
            # чужого генератора: заголовки здесь пишутся руками и читаются лучше
            # любой автоматики.
            prev=$(git describe --tags --abbrev=0 --match 'v*' "${{ github.ref_name }}^" 2>/dev/null || true)
            if [ -n "$prev" ]; then
              printf '\n## Что изменилось с %s\n\n' "$prev" >> notes.md
              git log --no-merges --pretty='- %s' "$prev".."${{ github.ref_name }}" >> notes.md
            fi
            gh release create "${{ github.ref_name }}" dist/*.zip \
              --title "${{ github.ref_name }}" \
              --latest \
              --notes-file notes.md
            exit 0
          fi

          # Ночная сборка живёт под одним тегом: прошлую вместе с тегом убираем,
          # новую кладём на её место. Помечена предварительной — «латест» должен
          # оставаться за вехой, даже если она вышла месяц назад.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly dist/*.zip \
            --title "Свежая сборка main" \
            --prerelease \
            --target "${{ github.sha }}" \
            --notes-file notes.md
