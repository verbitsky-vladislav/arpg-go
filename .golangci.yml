# Линтер: сторож того, что компилятор пропускает.
#
# Набор небольшой нарочно. Линтер ценен ровно до тех пор, пока его вывод читают,
# а читают его только тогда, когда он пуст в обычный день: список из тридцати
# замечаний про стиль игнорируется целиком вместе с той одной строчкой, ради
# которой всё затевалось.
version: "2"

linters:
  enable:
    - errcheck # проглоченная ошибка
    - govet # то, что и так гоняется руками
    - ineffassign # присвоение, которое никто не прочтёт
    - staticcheck # настоящие находки: устаревшие вызовы, мёртвые условия
    - unused # мёртвый код

  settings:
    staticcheck:
      # QF* — это подсказки «можно записать иначе» (закон де Моргана, switch
      # вместо цепочки if). Иначе — не значит понятнее: `if !(a || b)` читается
      # ровно как сказано, и переписывать его ради линтера незачем.
      #
      # ST1000/ST1020-ST1022 — правила оформления комментариев на английском
      # («comment should be of the form...»), а комментарии здесь русские.
      checks:
        - all
        - -QF1001
        - -QF1003
        - -QF1008
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022

    errcheck:
      # Ошибки, которые нечем обрабатывать: закрытие файла, открытого на
      # чтение, и запись в буфер в памяти. Проверять их — обряд, а не польза;
      # там, где закрытие важно (запись файла), оно проверяется явно.
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - encoding/binary.Write

formatters:
  enable:
    - gofmt
